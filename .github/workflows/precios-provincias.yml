# Cada mañana descarga los precios de todas las gasolineras de España (API pública del Ministerio),
# genera provincias.json, reconstruye la web y publica las 52 páginas /precio-gasolina-hoy/<provincia>/.
# Después avisa a IndexNow (los push hechos con GITHUB_TOKEN no lanzan el workflow indexnow.yml).
name: Precios por provincia
on:
  schedule:
    - cron: "10 4 * * *"   # 06:10 en Madrid en verano, 05:10 en invierno
    - cron: "10 13 * * *"  # 15:10 en verano: segunda actualización del día
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: precios-provincias
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar precios del Ministerio
        run: |
          for i in 1 2 3 4 5; do
            curl -fsS --max-time 180 -H "Accept: application/json" -A "Mozilla/5.0 (kilometroreal.com)" \
              -o estaciones.json "https://sedeaplicaciones.minetur.gob.es/ServiciosRESTCarburantes/PreciosCarburantes/EstacionesTerrestres/" && break
            echo "Intento $i fallido, reintento en 60 s"; sleep 60
          done
          test -s estaciones.json
      - name: Generar, construir y publicar
        run: |
          set -o pipefail
          git config user.name "kilometroreal-bot"
          git config user.email "actions@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 tools/provincias.py estaciones.json provincias.json
            python3 build.py | tail -1
            # Si el build falla, dist/ queda vacía: nunca publicarla así
            test -s dist/index.html || { echo "Build fallido: no se publica"; exit 1; }
            git add provincias.json dist fuel_history.json
            if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
            git commit -q -m "Precios por provincia: $(date -u +%Y-%m-%d)"
            git push -q origin HEAD:main && exit 0
            echo "Push rechazado, reintento"; sleep 20
          done
          exit 1
      - name: Avisar a IndexNow
        if: success()
        run: |
          sleep 720
          curl -fsS --retry 3 --retry-delay 30 https://kilometroreal.com/indexnow.php || true
